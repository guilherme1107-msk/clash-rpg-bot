<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100f12" />
    <title>Clash RPG Activity</title>
    <style>
      html,body,#root{min-height:100%;margin:0}body{background:#070608;color:#eee8e1}
      .boot-screen{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#351018 0,#140a0d 24%,#070608 64%);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center}
      .boot-screen::before{content:"";position:fixed;inset:0;opacity:.12;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px)}
      .boot-card{position:relative;width:min(520px,calc(100vw - 40px));padding:48px 26px;border:1px solid #56232b;background:linear-gradient(145deg,#100d10e8,#09080ae8);box-shadow:0 24px 80px #000,0 0 40px #a51f3033}
      .boot-logo{display:block;width:clamp(150px,32vw,210px);height:auto;margin:0 auto 12px;filter:drop-shadow(0 10px 22px #000) drop-shadow(0 0 15px #b3233438)}
      .boot-kicker{margin:0 0 9px;color:#c65260;font-size:10px;letter-spacing:.28em}.boot-title{margin:0;color:#f5eee7;font:600 clamp(42px,10vw,72px) Georgia,serif;letter-spacing:.04em}.boot-title-error{font-size:clamp(28px,6vw,48px);overflow-wrap:anywhere}.boot-status{display:block;margin-top:12px;color:#978d8e;font-size:11px;letter-spacing:.12em}
      .boot-line{height:2px;margin:28px auto 0;overflow:hidden;background:#2d2225}.boot-line::after{content:"";display:block;width:42%;height:100%;background:#d72d40;box-shadow:0 0 12px #ed4054;animation:boot-slide 1.25s ease-in-out infinite}
      @keyframes boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}@media(prefers-reduced-motion:reduce){.boot-line::after{animation:none;margin:auto}}
    </style>
  </head>
  <body><div id="root"><main class="boot-screen"><section class="boot-card"><img class="boot-logo" src="./assets/clashbot-logo.png" alt="ClashBot"><p class="boot-kicker">DISCORD ACTIVITY // SISTEMA ATIVO</p><h1 class="boot-title">CLASHBOT</h1><span class="boot-status">Sincronizando vínculo…</span><div class="boot-line"></div></section></main></div><script type="module" src="/src/main.jsx"></script></body>
</html>
